<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS specificity and cascading</title>

    <!-- <link rel = "stylesheet" href = "style.css"> -->
    <style>
        h1 {
            color: aqua;
        }

        .yellow {
            color: yellow;
        }

        .cred {
            color: red;
        }

        .cpurple {
            color: purple;
        }
        
        [data-x = "a"] {
            background-color: aqua;
        }

    </style>

</head>

<body>
    <div>
        <h1 class="yellow cred cpurple" data-x = "a">
            CSS specificity
        </h1>
    </div>
</body>

</html>

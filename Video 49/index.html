<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>

    <style>
        .img1{
            filter: blur(10px);
            
        }

        .img2{
            /* filter: brightness(50%); */
            filter: contrast(150%);

        }
        .img3{
            filter: sepia(150%);
        }
    </style>
</head>
<body>
    <div class="container">
        <img class = "img1" src = "picture.jpg">
        <img class = "img2" src = "srk.jpg">
        <img class = "img3" src = "akshay kumar.webp">
    </div>
</body>
</html>

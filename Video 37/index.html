<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Design</title>

    <style>
        body {
            background-color: black;
            color: black;
        }

        .navbar {
            border: 2px solid black;
            background-color: rgb(243, 152, 243);
        }

        .navbar ul {
            list-style: none;
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .navbar ul li:hover {
            color: rgb(255, 0, 43);
        }

        .main_mid {
            background-color: black;
            padding: 10px;
        }

        .main_head {
            border: 2px solid black;
            background-color: green;
        }

        .footer {
            border: 2px solid black;
            padding: 20px;
            background-color: white;
        }

        .main_head .mid {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main_head .mid .inside1 {
            background-color: rgb(255, 112, 136);
            height: 30vh;
            width: 30vh;

            display: flex;
            justify-content: center;
            align-items: center;

        }

        .main_head .mid .inside2 {
            background-color: lightblue;
            height: 30vh;
            width: 30vh;
            margin: 10px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sub_head {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
        }
        
        .sub_head .box_inside {
            border-radius: 30px;
            padding: 30px;
            color: white;
            border: 1px solid white;
        }

        .main {
            border: 1px solid white;
            padding: 2px;
        }

    </style>
</head>

<body>
    <div class = "main">
        <nav>
            <div class="navbar">
                This is a navbar
                <ul>
                    <li>Home</li>
                    <li>Our Products</li>
                    <li>About Us</li>
                    <li>Contact</li>
                </ul>
            </div>
    
        </nav>
        <div class="main_mid">
            <header class="main_head">
                Introductory content
                <div class="mid">
                    <div class="inside1">
                        box1
                    </div>
                    <div class="inside2">
                        box2
                    </div>
                </div>
            </header>
            <header class="sub_head">
                <div class="box_inside">
                    <div>
                        Welcome To The Sigma Web Development Course!
                    </div>
    
                </div>
            </header>
        </div>
    
        <footer class="footer">
            Concluding content
        </footer>
    </div>
</body>

</html>
